name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання коду (Checkout)
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Надання прав на виконання скриптів
        run: chmod +x scripts/*.sh

      - name: Етап Setup
        run: ./scripts/setup.sh

      - name: Етап Test
        run: ./scripts/test.sh

      - name: Етап Build
        if: always()
        run: ./scripts/build.sh

      - name: Збереження артефактів
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            reports/
            artifacts/